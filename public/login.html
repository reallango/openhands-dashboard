<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>OpenHands dashboard · sign in</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <form id="login" class="login-card" method="post" action="/login" autocomplete="on">
    <div class="brand"><img src="/icon.svg" alt="" width="28" height="28"> OpenHands dashboard</div>
    <label>User name <input name="user" autocomplete="username" required value="admin"></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required autofocus></label>
    <button type="submit" class="primary">Sign in</button>
    <p id="error" class="error" role="alert"></p>
  </form>
  <script src="/login.js"></script>
</body>
</html>
